<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAC Address Rotator</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 { text-align: center; margin-bottom: 30px; }

        .card {
            background-color: var(--card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .mac-display {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .mac-box {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .mac-box.active {
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .mac-label {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .mac-value {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            color: var(--text);
            word-break: break-all;
        }

        .mac-box.active .mac-value {
            color: var(--success);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 10px;
        }

        button:hover { opacity: 0.9; }

        .btn-start { background-color: var(--primary); color: white; }
        .btn-stop { background-color: var(--danger); color: white; }
        .btn-disabled { background-color: #475569; cursor: not-allowed; }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-inactive { background-color: rgba(148, 153, 160, 0.2); color: var(--text-muted); }

        .log-container {
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            background-color: #000;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #111; padding-bottom: 2px; }
        .log-error { color: var(--danger); }
        .log-info { color: var(--text-muted); }
        .log-success { color: var(--success); }
        .log-warn { color: var(--warning); }

        .warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .mac-display { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MAC Address Rotator</h1>

        <div class="card">
            <div class="warning">
                ⚠️ <strong>WARNING:</strong> Changing MAC will disconnect you from the network. 
                Do not use your active connection interface.
            </div>

            <div class="mac-display">
                <div class="mac-box" id="originalBox">
                    <div class="mac-label">Original MAC</div>
                    <div class="mac-value" id="originalMac">--:--:--:--:--:--</div>
                </div>
                <div class="mac-box" id="currentBox">
                    <div class="mac-label">Current MAC</div>
                    <div class="mac-value" id="currentMac">--:--:--:--:--:--</div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Control Panel</h2>
                <span id="statusIndicator" class="status-badge status-inactive">STOPPED</span>
            </div>

            <div id="configForm">
                <div class="form-group">
                    <label>Network Interface</label>
                    <select id="interface">
                        <option value="">Loading interfaces...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rotation Interval (seconds)</label>
                    <input type="number" id="interval" value="60" min="5">
                </div>

                <button id="startBtn" class="btn-start" onclick="startRotation()">Start Rotation</button>
                <button id="stopBtn" class="btn-stop btn-disabled" onclick="stopRotation()" disabled>Stop Rotation</button>
            </div>
        </div>

        <div class="card">
            <h2>Activity Logs</h2>
            <div id="logs" class="log-container">
                <div class="log-entry log-info">System ready. Waiting for commands.</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let pollInterval = null;

        // Load interfaces on startup
        async function loadInterfaces() {
            try {
                const response = await fetch(`${API_URL}/interfaces`);
                const data = await response.json();
                const select = document.getElementById('interface');
                select.innerHTML = '';
                data.interfaces.forEach(iface => {
                    const opt = document.createElement('option');
                    opt.value = iface;
                    opt.textContent = iface;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Failed to load interfaces", error);
            }
        }

        async function updateMacDisplay() {
            try {
                const response = await fetch(`${API_URL}/mac`);
                const data = await response.json();
                
                if (data.interface) {
                    document.getElementById('originalMac').textContent = data.original_mac || 'Unknown';
                    document.getElementById('currentMac').textContent = data.current_mac || 'Unknown';
                    
                    // Highlight if changed
                    if (data.original_mac && data.current_mac && data.original_mac !== data.current_mac) {
                        document.getElementById('currentBox').classList.add('active');
                    } else {
                        document.getElementById('currentBox').classList.remove('active');
                    }
                }
            } catch (error) {
                console.error("Failed to get MAC info", error);
            }
        }

        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/status`);
                const data = await response.json();
                
                const statusEl = document.getElementById('statusIndicator');
                const startBtn = document.getElementById('startBtn');
                const stopBtn = document.getElementById('stopBtn');

                if (data.is_running) {
                    statusEl.textContent = "RUNNING";
                    statusEl.className = "status-badge status-active";
                    startBtn.disabled = true;
                    startBtn.className = "btn-disabled";
                    stopBtn.disabled = false;
                    stopBtn.className = "btn-stop";
                } else {
                    statusEl.textContent = "STOPPED";
                    statusEl.className = "status-badge status-inactive";
                    startBtn.disabled = false;
                    startBtn.className = "btn-start";
                    stopBtn.disabled = true;
                    stopBtn.className = "btn-disabled btn-stop";
                    
                    if (pollInterval) {
                        clearInterval(pollInterval);
                        pollInterval = null;
                    }
                }
                
                // Update MAC display with status data
                if (data.config) {
                    document.getElementById('originalMac').textContent = data.config.original_mac || '--:--:--:--:--:--';
                    document.getElementById('currentMac').textContent = data.config.current_mac || '--:--:--:--:--:--';
                    
                    if (data.config.original_mac && data.config.current_mac && 
                        data.config.original_mac !== data.config.current_mac) {
                        document.getElementById('currentBox').classList.add('active');
                    } else {
                        document.getElementById('currentBox').classList.remove('active');
                    }
                }
            } catch (error) {
                console.error("Failed to check status", error);
            }
        }

        async function fetchLogs() {
            try {
                const response = await fetch(`${API_URL}/logs`);
                const logs = await response.json();
                const logContainer = document.getElementById('logs');
                
                logContainer.innerHTML = '';
                logs.forEach(log => {
                    const div = document.createElement('div');
                    div.className = 'log-entry';
                    const msg = log.message.toLowerCase();
                    if (msg.includes('error')) div.className += ' log-error';
                    else if (msg.includes('success')) div.className += ' log-success';
                    else if (msg.includes('warn') || msg.includes('critical')) div.className += ' log-warn';
                    else div.className += ' log-info';
                    
                    const time = new Date(log.time * 1000).toLocaleTimeString();
                    div.textContent = `[${time}] ${log.message}`;
                    logContainer.appendChild(div);
                });
                
                logContainer.scrollTop = logContainer.scrollHeight;
            } catch (error) {
                console.error("Failed to fetch logs", error);
            }
        }

        async function startRotation() {
            const interface = document.getElementById('interface').value;
            const interval = parseInt(document.getElementById('interval').value);

            if (!interface) {
                alert("Please select an interface");
                return;
            }
            if (interval < 5) {
                alert("Interval must be at least 5 seconds");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interface: interface, interval_seconds: interval })
                });

                if (!response.ok) {
                    const error = await response.json();
                    alert(error.error || "Failed to start");
                    return;
                }

                const data = await response.json();
                document.getElementById('originalMac').textContent = data.original_mac;
                document.getElementById('currentMac').textContent = data.original_mac; // Will update on next poll
                
                checkStatus();
                if (!pollInterval) {
                    pollInterval = setInterval(() => {
                        checkStatus();
                        fetchLogs();
                    }, 1000);
                }
            } catch (error) {
                alert("Connection failed. Is the backend running?");
            }
        }

        async function stopRotation() {
            try {
                await fetch(`${API_URL}/stop`, { method: 'POST' });
                checkStatus();
                fetchLogs();
            } catch (error) {
                alert("Failed to stop rotation");
            }
        }

        // Initialize
        loadInterfaces();
        checkStatus();
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
