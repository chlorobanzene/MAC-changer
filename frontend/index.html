<!DOCTYPE html>
<html>
<head>
    <title>MAC Rotator - Minimal</title>
</head>
<body>
    <h1>MAC Rotator Test</h1>
    <p>If you see this, HTML is loading.</p>
    
    <button onclick="testConnection()">TEST CONNECTION (Start)</button>
    <button onclick="stopConnection()">STOP</button>
    
    <pre id="output" style="background:#000; color:#0f0; padding:10px;">Waiting...</pre>

    <script>
        // If this alert does NOT pop up, your browser is caching the old file.
        // Press Ctrl+Shift+R or use Incognito Mode.
        alert("JavaScript Loaded Successfully!");

        function log(msg) {
            document.getElementById('output').innerText = msg;
            console.log(msg);
        }

        async function testConnection() {
            log("Attempting to connect to backend...");
            try {
                // We use 127.0.0.1 to bypass any DNS issues
                const response = await fetch('http://127.0.0.1:8000/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interface: 'eth0', interval_seconds: 60 })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    log("SUCCESS: Backend responded. Rotation started (or attempted). Check server logs.");
                    alert("SUCCESS! The backend is working.");
                } else {
                    log("ERROR: Backend rejected request. Response: " + JSON.stringify(data));
                    alert("Error from server: " + JSON.stringify(data));
                }
            } catch (error) {
                log("CRITICAL: Could not connect to backend. Error: " + error.message);
                alert("Connection Failed: " + error.message);
            }
        }

        async function stopConnection() {
            log("Attempting to stop...");
            try {
                await fetch('http://127.0.0.1:8000/api/stop', { method: 'POST' });
                log("Stop command sent.");
                alert("Stop command sent.");
            } catch (error) {
                log("Stop failed: " + error.message);
            }
        }
    </script>
</body>
</html>
